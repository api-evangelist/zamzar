aid: zamzar
name: Zamzar
description: >
  Zamzar is an online file conversion platform with a REST API for converting files between
  100+ formats including documents, videos, audio, images, and CAD files. The API supports
  over 1,100 distinct format conversions processed asynchronously using a credit-based
  billing model. File sources include direct upload, HTTP/FTP/SFTP URLs, and Amazon S3.
  Both a production environment and a sandbox environment are provided for development.
